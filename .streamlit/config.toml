# Streamlit theme + server config for statarb-research.
# Applied automatically both locally and on Streamlit Community Cloud.
[theme]
base = "light"
primaryColor = "#0072B2"           # Okabe-Ito blue (matches the charts)
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F7FA"
textColor = "#1B1F24"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false
