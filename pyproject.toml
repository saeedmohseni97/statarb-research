[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "statarb"
version = "0.1.0"
description = "A statistical-arbitrage research study on US equities/ETFs (cointegration pairs trading)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "yfinance>=0.2.40",
]

[project.optional-dependencies]
report = ["quantstats>=0.0.62"]
app = ["streamlit>=1.30"]
dev = ["pytest>=7.4", "jupyter>=1.0"]

[tool.setuptools.packages.find]
include = ["statarb*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
